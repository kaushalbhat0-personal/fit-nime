<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Fit-Nime training companion</title>
  <!-- Warm backdrop disc so the figure reads on white cards. Transparent outside it. -->
  <circle cx="100" cy="100" r="90" fill="#FBF3E8" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="#F1E2CB" stroke-width="3" />

  <!-- Sparkle accents -->
  <path d="M42 46l3.2 7.2 7.2 3.2-7.2 3.2L42 66.8l-3.2-7.2-7.2-3.2 7.2-3.2z" fill="#F5A623" />
  <path d="M160 52l2.4 5.4 5.4 2.4-5.4 2.4-2.4 5.4-2.4-5.4-5.4-2.4 5.4-2.4z" fill="#3E8E87" />
  <circle cx="162" cy="140" r="4" fill="#F5A623" opacity="0.7" />

  <!-- Raised arm (viewer right) holding a dumbbell -->
  <rect x="132" y="96" width="18" height="44" rx="9" fill="#FFDFC9" />
  <rect x="130" y="88" width="22" height="14" rx="4" fill="#3E8E87" />
  <rect x="118" y="76" width="8" height="30" rx="3.5" fill="#3A3A3E" />
  <rect x="156" y="76" width="8" height="30" rx="3.5" fill="#3A3A3E" />
  <rect x="126" y="82" width="48" height="7" rx="3.5" fill="#6B7280" />

  <!-- Back hair -->
  <path d="M62 92c-3-34 16-56 38-56s41 22 38 56l-6 34c-2 8-12 12-19 8l-3-4-4 6c-3 5-11 6-15 2l-4-5-3 4c-6 5-17 1-18-7z" fill="#2B2B30" />

  <!-- Neck + training top -->
  <rect x="90" y="118" width="20" height="18" rx="8" fill="#F6C9A8" />
  <path d="M58 200v-16c0-14 12-22 26-26l8-3h16l8 3c14 4 26 12 26 26v16z" fill="#C65D3B" />
  <path d="M88 155h24l-3 10H91z" fill="#FBF3E8" />
  <path d="M58 200v-10h84v10z" fill="#A84A2E" opacity="0.55" />

  <!-- Relaxed arm (viewer left) -->
  <rect x="50" y="120" width="18" height="42" rx="9" fill="#C65D3B" />
  <rect x="50" y="152" width="18" height="12" rx="6" fill="#FFDFC9" />
  <rect x="50" y="146" width="18" height="8" rx="4" fill="#3E8E87" />

  <!-- Face -->
  <ellipse cx="100" cy="95" rx="33" ry="35" fill="#FFDFC9" />

  <!-- Fringe -->
  <path d="M67 88c-1-20 13-33 33-33s34 13 33 33l-7-1-4-12-6 12-5-13-6 13-5-12-6 11-5-11-5 10-6-9-4 10z" fill="#2B2B30" />
  <path d="M67 92c-4 8-4 18 1 27l7-4c-3-8-3-16 0-24z" fill="#2B2B30" />
  <path d="M133 92c4 8 4 18-1 27l-7-4c3-8 3-16 0-24z" fill="#2B2B30" />

  <!-- Headband with knot tails -->
  <path d="M68 66c8-8 20-12 32-12s24 4 32 12l-3 10c-8-6-18-9-29-9s-21 3-29 9z" fill="#3E8E87" />
  <path d="M130 62l16-8 2 10-12 8z" fill="#357B75" />
  <path d="M132 68l14-2-2 12-10-2z" fill="#3E8E87" />

  <!-- Happy closed eyes -->
  <path d="M80 98q7-7 14 0" fill="none" stroke="#2B2B30" stroke-width="3.2" stroke-linecap="round" />
  <path d="M106 98q7-7 14 0" fill="none" stroke="#2B2B30" stroke-width="3.2" stroke-linecap="round" />

  <!-- Blush + smile -->
  <ellipse cx="82" cy="110" rx="6" ry="3.6" fill="#E8A082" opacity="0.8" />
  <ellipse cx="118" cy="110" rx="6" ry="3.6" fill="#E8A082" opacity="0.8" />
  <path d="M92 113q8 8 16 0" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round" />
</svg>
